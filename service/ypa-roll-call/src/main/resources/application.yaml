spring:
  application:
    name: ypa-roll-call
  profiles:
    active: ${ACTIVE_PROFILES:dev}

app:
  keycloak:
    client-id: ${KEYCLOAK_CLIENT_ID:myclient}
    client-secret: ${KEYCLOAK_CLIENT_SECRET:sYXnZMAiSY4ouudztjv73iHyPr5H0dQC}
    out-uri: ${KEYCLOAK_ISSUER_URI:http://localhost/auth/realms/oAuth}
    docker-uri: ${DOCKER_KEYCLOAK_ISSUER_URI:http://localhost/auth/realms/oAuth}
    backend-callback-uri: ${BACKEND_CALLBACK_URI:http://localhost:8085/api/v1/auth/callback}
    frontend-redirect-uri: ${FRONTEND_REDIRECT_URI:http://localhost:5173/callback}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST, PUT,DELETE, OPTIONS}

livekit:
  url: ${LIVEKIT_URL:http://localhost:7880}
  api-key: ${LIVEKIT_API_KEY:devkey}
  api-secret: ${LIVEKIT_API_SECRET:secret}

server:
  port: 8085

logging:
  level:
    org.springframework.web.cors: TRACE
    org.springframework.security: TRACE
    org.springframework.security.web.FilterChainProxy: DEBUG
    org.springframework.security.web.csrf: DEBUG
    org.springframework.security.web.access: DEBUG
    org.springframework.security.web.authentication: DEBUG
    org.springframework.security.oauth2: DEBUG